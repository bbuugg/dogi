[package]
name = "opsdesk"
version = "0.1.0"
description = "AI 驱动的运维终端工具（Tauri 版）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# 本地 PTY（Windows 走 ConPTY）
portable-pty = "0.9"

# SSH 客户端（纯 Rust，ring 后端避免 C 编译链依赖）
russh = { version = "0.63", default-features = false, features = ["ring"] }

# 存储
sled = "0.34"

# 敏感字段加密（等价 Electron safeStorage 的落盘保护）
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
genai = "0.6.5"
rmcp = { version = "2.2.0", features = ["client", "transport-child-process"] }

# 终端输出清洗（剥离 ANSI 转义）与按键序列翻译
regex = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
